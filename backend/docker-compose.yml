# Docker Compose for backend + Caddy reverse proxy
# NOTE: The GitHub Actions workflow writes a copy of this file to the VPS and uses the GHCR image.

version: "3.8"
services:
  app:
    image: ghcr.io/OWNER/REPO/backend:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    volumes:
      - ./uploads:/app/uploads
    networks:
      - web

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web

volumes:
  caddy_data:
  caddy_config:

networks:
  web:
    driver: bridge
