services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-ghcr.io/onlinegologistics/goaapp-backend:latest}
    container_name: goaapp-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=7001
    # No host port published on purpose: the shared nginx_gateway container reverse-proxies
    # to this container by name (goaapp-backend:7001) over the goairclass_v3_app_network
    # Docker network it's already joined to — see backend/DEPLOY.md. Nothing here is exposed
    # directly to the internet.
    networks:
      - goairclass_v3_app_network
    volumes:
      - ./uploads:/app/uploads
      - ./tickets:/app/tickets
      - ./data/incremental_sync_state.json:/app/config/incremental_sync_state.json
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Pre-existing network created by the GoAirClass_V3 docker-compose stack, already shared
  # with the nginx_gateway container. Reusing it (instead of publishing a host port) is what
  # lets the gateway reach this container without any changes to the gateway itself.
  goairclass_v3_app_network:
    external: true
