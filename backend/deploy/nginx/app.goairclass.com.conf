# app.goairclass.com routing for the GoAApp backend — a snippet to add to the SHARED
# reverse-proxy config at /var/www/gateway/nginx.conf on the production VPS, NOT a
# standalone Nginx vhost. That gateway is one Docker container (nginx_gateway) that
# fronts every app on the box, in one nginx.conf with many server{} blocks. See
# backend/DEPLOY.md for the full picture and the exact one-time migration steps.
#
# app.goairclass.com used to share a server{} block with goairclass.com/www — routing all
# three to the old GoAirClass_V3 website. It has been split out on purpose: goairclass.com
# and www keep working exactly as before, app.goairclass.com now points only at this API.
#
# Reuses the existing shared cert (it already covers this subdomain — same one the combined
# block used), so no new certbot run is needed.

server {
    listen 443 ssl;
    server_name app.goairclass.com;

    ssl_certificate /etc/letsencrypt/live/goairclass.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goairclass.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Video/document uploads can be large; the app itself accepts up to 10mb JSON bodies
    # and multer-based file uploads on top of that.
    client_max_body_size 25M;

    location / {
        # goaapp-backend is reached by container name because nginx_gateway and this
        # container share the goairclass_v3_app_network Docker network — no host port
        # involved. See docker-compose.yml.
        proxy_pass http://goaapp-backend:7001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # server.js sets a 10 minute socket timeout for large video uploads — match it here
        # so Nginx doesn't cut the connection first.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
