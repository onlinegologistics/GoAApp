# Nginx reverse proxy for app.goairclass.com -> GoAApp backend (Docker container on 127.0.0.1:7001)
#
# Install on the server at /etc/nginx/sites-available/app.goairclass.com.conf and symlink into
# sites-enabled. See backend/DEPLOY.md for the full first-time server setup, including how the
# HTTPS server block below gets created by `certbot --nginx`.

# Plain HTTP: serve ACME challenge for Let's Encrypt, redirect everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name app.goairclass.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: terminate TLS, proxy to the backend container.
# NOTE: the `ssl_certificate` / `ssl_certificate_key` lines are normally added automatically the
# first time you run `sudo certbot --nginx -d app.goairclass.com`. If you provision certs another
# way, add them here yourself.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.goairclass.com;

    # ssl_certificate /etc/letsencrypt/live/app.goairclass.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/app.goairclass.com/privkey.pem;

    # Video/document uploads can be large; the app itself accepts up to 10mb JSON bodies
    # and multer-based file uploads on top of that.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:7001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # server.js sets a 10 minute socket timeout for large video uploads — match it here
        # so Nginx doesn't cut the connection first.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
