name: Build and Deploy to Hostinger VPS

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push image to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: SSH and deploy (write compose & Caddyfile, pull image, start)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            set -e
            TARGET_DIR="/home/${{ secrets.VPS_USER }}/goair"
            mkdir -p "$TARGET_DIR"

            cat > "$TARGET_DIR/docker-compose.yml" <<EOF
            version: "3.8"
            services:
              app:
                image: ghcr.io/${{ github.repository }}/backend:latest
                restart: unless-stopped
                environment:
                  - NODE_ENV=production
                volumes:
                  - ./uploads:/app/uploads
                networks:
                  - web

              caddy:
                image: caddy:2
                restart: unless-stopped
                ports:
                  - "80:80"
                  - "443:443"
                volumes:
                  - ./Caddyfile:/etc/caddy/Caddyfile
                  - caddy_data:/data
                  - caddy_config:/config
                networks:
                  - web

            volumes:
              caddy_data:
              caddy_config:

            networks:
              web:
                driver: bridge
            EOF

            cat > "$TARGET_DIR/Caddyfile" <<'CADDYEOF'
            app.goairclass.com {
              reverse_proxy app:5000
              encode gzip
            }
            CADDYEOF

            cd "$TARGET_DIR"

            if ! command -v docker >/dev/null 2>&1; then
              echo "Docker not found on VPS. Install Docker first and re-run."
              exit 1
            fi

            docker compose pull || true
            docker compose up -d --remove-orphans

            echo "Deployment complete."

      - name: Notify success
        run: echo "Deployed to Hostinger VPS (app.goairclass.com)"
