name: Backend Deploy

# Builds the backend Docker image, pushes it to GitHub Container Registry, then SSHes
# into the production server and rolls the container over via docker-compose. Runs on
# every push to main that touches backend/, or manually via workflow_dispatch.
#
# One-time setup required before this workflow can deploy anything — see backend/DEPLOY.md.
# Required repo secrets:
#   VPS_HOST      - production VPS IP/hostname
#   VPS_USER      - SSH user with docker permissions on the VPS
#   VPS_SSH_KEY   - private key matching an authorized_keys entry on the VPS
#   VPS_PORT      - (optional) SSH port, defaults to 22
#   DEPLOY_PATH   - (optional) path to backend/ on the VPS, defaults to /opt/goaapp/backend
#   GHCR_TOKEN    - a GitHub PAT (classic, read:packages) the VPS uses to pull the image
#                   if the ghcr.io package is private

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image name (must be lowercase for Docker)
        id: vars
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${{ env.REGISTRY }}/${owner}/goaapp-backend" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:latest
            ${{ steps.vars.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH || '/opt/goaapp/backend' }}"
            if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
              echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            fi
            export BACKEND_IMAGE="${{ needs.build-and-push.outputs.image }}:${{ github.sha }}"
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
